    - "Chain of Thought: 4 etapas com ênfase em especificidade"
    - "Role Prompting: PM sênior BDD"
    - "Adaptive Complexity: Formato específico por nível"
    - "Specificity Enhancement: Ênfase em critérios específicos para bugs simples"
    - "Conciseness Control: Limites restritos para bugs complexos (máx 3 aspectos, máx 4 tasks)"
    - "Self-Validation: Checklist incluindo especificidade e concisão"
