    - "Chain of Thought: 4 etapas de análise"
    - "Role Prompting: PM sênior especialista BDD"
    - "Adaptive Complexity: Formato específico por nível"
    - "Conciseness Control: Limites explícitos para evitar verbosidade em bugs complexos"
