  techniques_applied:
    - "Few-shot Learning: 3 exemplos alinhados com dataset (simples, médio, complexo)"
    - "Chain of Thought: 4 etapas claras (Analisar → Identificar → Escrever → Validar)"
    - "Role Prompting: Product Manager sênior especializado em BDD"
    - "Adaptive Complexity: Formato específico para cada nível"
    - "Self-Validation: Checklist completo incluindo verificação de verbosidade"
    - "Conciseness Control: Limites explícitos (máx 4 aspectos, máx 6 tasks) do v7"
    - "Clarity Enhancement: Diretrizes claras por complexidade do v7"
